name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create the release PR or stage the package
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write # Required to push the version branch and branch tags.
      pull-requests: write # Required to open the release pull request.
      id-token: write # Required for npm trusted publishing OIDC.
    env:
      CI: true
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changesets action pushes the version branch with the workflow
          # credentials, so this job keeps them.
          persist-credentials: true

      - name: Install mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.9.6
          install: true
          cache: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Two modes, one workflow: while changeset files are pending, the action
      # opens or updates the Version Packages pull request that assembles the
      # changelog and bumps the version. Once that pull request merges, no
      # changesets remain and the publish script builds and stages the package
      # on npm; a human then approves the staged release with 2FA on npmjs.com.
      - name: Create the release PR or stage the npm package
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: bun run changeset version
          publish-script: bun run release:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
