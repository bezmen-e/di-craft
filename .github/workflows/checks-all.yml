name: checks / all

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      lib: ${{ steps.filter.outputs.lib }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed areas
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="$(git rev-list --max-parents=0 HEAD)"
            fi
          fi

          head="${{ github.sha }}"
          lib=false
          docs=false

          while IFS= read -r file; do
            case "$file" in
              bun.lock|bunfig.toml|package.json|mise.toml|biome.json|.config/**|packages/di-craft/package.json)
                lib=true
                docs=true
                ;;
              packages/di-craft/src/*.test.ts|packages/di-craft/src/**/*.test.ts|packages/di-craft/bench/**|packages/di-craft/tsconfig/**|packages/di-craft/mise.toml|packages/di-craft/tsdown.config.ts|packages/di-craft/tsconfig.json)
                lib=true
                ;;
              packages/di-craft/src/**)
                lib=true
                docs=true
                ;;
              docs/**|assets/**|packages/di-craft/README.md)
                docs=true
                ;;
              .github/workflows/checks-all.yml)
                lib=true
                docs=true
                ;;
            esac
          done < <(git diff --name-only "$base" "$head")

          echo "lib=$lib" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"

  library:
    name: Check library
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.lib == 'true'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true
          cache: true

      - name: Enable mise experimental features
        run: mise settings experimental=true

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run library checks
        run: mise run --no-deps //packages/di-craft:checks
        env:
          CI: true

      - name: Run Fallow checks
        run: mise run --no-deps lint:fallow
        env:
          CI: true

  docs:
    name: Check docs
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true
          cache: true

      - name: Enable mise experimental features
        run: mise settings experimental=true

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run docs checks
        run: mise run //docs:checks
        env:
          CI: true

  complete:
    name: Checks complete
    runs-on: ubuntu-latest
    needs:
      - changes
      - library
      - docs
    if: always()
    timeout-minutes: 5
    steps:
      - name: Verify check results
        shell: bash
        run: |
          set -euo pipefail

          for result in "${{ needs.changes.result }}" "${{ needs.library.result }}" "${{ needs.docs.result }}"; do
            case "$result" in
              failure|cancelled)
                exit 1
                ;;
            esac
          done

          if [ "${{ needs.library.result }}" = "skipped" ] && [ "${{ needs.docs.result }}" = "skipped" ]; then
            echo "No library or docs changes detected."
          fi
