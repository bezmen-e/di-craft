<style>
	@import url("https://fonts.googleapis.com/css2?family=Sora:wght@400;500&display=swap");
	#di-icon-v2 {
		--di-page: light-dark(#ffffff, #1b1b1f);
		--di-text: light-dark(#27272c, #e5e5de);
		--di-line: light-dark(#e5e5e9, #303037);
		--di-brand: light-dark(#5960ed, #7b80ff);
		--di-soft: light-dark(#f7f7fa, #202127);
		color-scheme: light dark;
		font-family: "Sora", ui-sans-serif, system-ui, sans-serif;
	}
	#di-icon-v2 .di-grid {
		display: grid;
		grid-template-columns: repeat(3, minmax(0, 1fr));
		gap: 1.25rem;
		margin-top: 1.5rem;
	}
	#di-icon-v2 .di-direction { min-width: 0; }
	#di-icon-v2 .di-window {
		overflow: hidden;
		border: 1px solid var(--di-line);
		border-radius: 0.9rem;
		background: var(--di-page);
		color: var(--di-text);
	}
	#di-icon-v2 .di-header {
		display: flex;
		align-items: center;
		height: 3.75rem;
		padding-inline: 1rem;
		border-bottom: 1px solid var(--di-line);
	}
	#di-icon-v2 .di-lockup {
		display: inline-flex;
		align-items: center;
		gap: 0.65rem;
		font-weight: 500;
		letter-spacing: -0.045em;
		white-space: nowrap;
	}
	#di-icon-v2 .di-lockup--integrated { gap: 0.08rem; }
	#di-icon-v2 .di-lockup svg {
		width: 1.7rem;
		height: 1.7rem;
		flex: none;
		color: var(--di-brand);
	}
	#di-icon-v2 .di-lockup--integrated svg { width: 2.2rem; }
	#di-icon-v2 .di-hero {
		display: grid;
		place-items: center;
		min-height: 11.5rem;
		padding: 1.5rem;
		background: radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--di-brand) 13%, transparent), transparent 48%), var(--di-soft);
	}
	#di-icon-v2 .di-hero-lockup {
		display: grid;
		place-items: center;
		gap: 0.75rem;
		color: var(--di-brand);
	}
	#di-icon-v2 .di-hero-lockup svg { width: 5.5rem; height: 5.5rem; }
	#di-icon-v2 .di-wordmark {
		color: var(--di-text);
		font-weight: 500;
		letter-spacing: -0.055em;
	}
	#di-icon-v2 .di-sizes {
		display: flex;
		align-items: center;
		justify-content: center;
		gap: 1.15rem;
		padding: 0.85rem 1rem;
		border-top: 1px solid var(--di-line);
		color: var(--di-brand);
	}
	#di-icon-v2 .di-sizes svg:nth-child(1) { width: 1rem; height: 1rem; }
	#di-icon-v2 .di-sizes svg:nth-child(2) { width: 1.5rem; height: 1.5rem; }
	#di-icon-v2 .di-sizes svg:nth-child(3) { width: 2rem; height: 2rem; }
	#di-icon-v2 .di-caption {
		display: flex;
		align-items: center;
		justify-content: space-between;
		gap: 0.75rem;
		margin-top: 0.8rem;
	}
	#di-icon-v2 .di-caption h3,
	#di-icon-v2 .di-caption p { margin: 0; }
	#di-icon-v2 .di-caption p { color: var(--muted-foreground); }
	@media (max-width: 820px) {
		#di-icon-v2 .di-grid { grid-template-columns: 1fr; }
		#di-icon-v2 .di-hero { min-height: 9rem; }
	}
</style>

<div id="di-icon-v2">
	<svg width="0" height="0" aria-hidden="true" style="position:absolute">
		<symbol id="mark-ligature" viewBox="0 0 64 64">
			<path fill="currentColor" fill-rule="evenodd" d="M31 7v50h-9C10.3 57 3 48.2 3 34s7.3-23 19-23h9Zm-9 15c-5.2 0-8.5 4.8-8.5 12S16.8 46 22 46h.5V22Zm18 5h10v30H40Z" />
			<circle cx="45" cy="15.5" r="5.5" fill="currentColor" />
		</symbol>
		<symbol id="mark-scope" viewBox="0 0 64 64">
			<path d="M11 8h17c17 0 27 9.7 27 24S45 56 28 56H11V8Z" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round" />
			<path d="M24 21h5c8.5 0 13.5 4.4 13.5 11S37.5 43 29 43h-5V21Z" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round" opacity="0.72" />
		</symbol>
		<symbol id="mark-resolve" viewBox="0 0 64 64">
			<path d="M9 32h14c9 0 9-16 19-16h13M23 32c9 0 9 16 19 16h13" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" />
			<circle cx="9" cy="32" r="5" fill="currentColor" />
			<circle cx="55" cy="16" r="5" fill="currentColor" />
			<circle cx="55" cy="48" r="5" fill="currentColor" />
		</symbol>
	</svg>

	<h2>Три направления без «микросхемы»</h2>
	<p class="subtitle">Один шрифт — Sora. У каждого знака показаны header, hero и размеры favicon.</p>
	<div class="di-grid">
		<section class="di-direction">
			<div class="di-window">
				<div class="di-header"><div class="di-lockup di-lockup--integrated"><svg aria-hidden="true"><use href="#mark-ligature" /></svg><span>-craft</span></div></div>
				<div class="di-hero"><div class="di-hero-lockup"><svg role="img" aria-label="Ligature di"><use href="#mark-ligature" /></svg><span class="di-wordmark">di-craft</span></div></div>
				<div class="di-sizes"><svg aria-hidden="true"><use href="#mark-ligature" /></svg><svg aria-hidden="true"><use href="#mark-ligature" /></svg><svg aria-hidden="true"><use href="#mark-ligature" /></svg></div>
			</div>
			<div class="di-caption"><div><h3>A · Ligature</h3><p><code>di</code> встроено в wordmark</p></div><button type="button" class="btn mock-button" data-choice="a" onclick="toggleSelect(this)">Выбрать A</button></div>
		</section>

		<section class="di-direction">
			<div class="di-window">
				<div class="di-header"><div class="di-lockup"><svg aria-hidden="true"><use href="#mark-scope" /></svg><span>di-craft</span></div></div>
				<div class="di-hero"><div class="di-hero-lockup"><svg role="img" aria-label="Nested container d"><use href="#mark-scope" /></svg><span class="di-wordmark">di-craft</span></div></div>
				<div class="di-sizes"><svg aria-hidden="true"><use href="#mark-scope" /></svg><svg aria-hidden="true"><use href="#mark-scope" /></svg><svg aria-hidden="true"><use href="#mark-scope" /></svg></div>
			</div>
			<div class="di-caption"><div><h3>B · Scope</h3><p>Вложенные контейнеры образуют <code>d</code></p></div><button type="button" class="btn mock-button" data-choice="b" onclick="toggleSelect(this)">Выбрать B</button></div>
		</section>

		<section class="di-direction">
			<div class="di-window">
				<div class="di-header"><div class="di-lockup"><svg aria-hidden="true"><use href="#mark-resolve" /></svg><span>di-craft</span></div></div>
				<div class="di-hero"><div class="di-hero-lockup"><svg role="img" aria-label="Dependency resolution branch"><use href="#mark-resolve" /></svg><span class="di-wordmark">di-craft</span></div></div>
				<div class="di-sizes"><svg aria-hidden="true"><use href="#mark-resolve" /></svg><svg aria-hidden="true"><use href="#mark-resolve" /></svg><svg aria-hidden="true"><use href="#mark-resolve" /></svg></div>
			</div>
			<div class="di-caption"><div><h3>C · Resolve</h3><p>Одна точка собирает граф зависимостей</p></div><button type="button" class="btn mock-button" data-choice="c" onclick="toggleSelect(this)">Выбрать C</button></div>
		</section>
	</div>
</div>

<script>
	if (typeof window.toggleSelect !== "function") {
		window.toggleSelect = (element) => {
			const root = document.getElementById("di-icon-v2");
			for (const button of root.querySelectorAll("[data-choice]")) {
				const selected = button === element;
				button.classList.toggle("is-selected", selected);
				button.setAttribute("aria-pressed", String(selected));
			}
		};
	}
</script>
