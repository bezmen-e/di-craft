[vars]
build_dir = "{{ config_root }}/.var/dist"
docs_out_dir = "{{ vars.build_dir }}/docs"
cf_pages_out_dir = "{{ vars.build_dir }}/cf-pages"

[env]
CF_PAGES_OUT_DIR = "{{ vars.cf_pages_out_dir }}"

[tasks."build:lib"]
description = "Build the npm package"
run = "mise run --no-deps //packages/di-craft:build"
sources = [
	".config/mise/conf.d/_config.toml",
	".config/mise/conf.d/tasks-build.toml",
	"bun.lock",
	"bunfig.toml",
	"mise.toml",
	"package.json",
	"packages/di-craft/mise.toml",
	"packages/di-craft/package.json",
	"packages/di-craft/src/**/*.ts",
	"packages/di-craft/tsconfig/**/*.json",
	"packages/di-craft/tsconfig.json",
	"packages/di-craft/tsdown.config.ts",
]
outputs = ["packages/di-craft/dist/**/*"]

[tasks."build:docs"]
description = "Build the documentation site"
run = "mise run --no-deps //docs:build"
outputs = ["{{ vars.docs_out_dir }}/**/*"]

[tasks."build:cf-pages"]
description = "Prepare deployment artifacts for Cloudflare Pages"
run = "mise run --no-deps //docs:build:base {{ vars.cf_pages_out_dir }}"
sources = [
	".config/mise/conf.d/_config.toml",
	".config/mise/conf.d/tasks-build.toml",
	"assets/**/*",
	"bun.lock",
	"bunfig.toml",
	"docs/examples/**/*.ts",
	"docs/mise.toml",
	"docs/scripts/**/*.mjs",
	"docs/src/**/*.{md,mdx,ts,astro,css}",
	"docs/astro.config.mjs",
	"docs/package.json",
	"docs/public/**/*",
	"docs/tsconfig*.json",
	"mise.toml",
	"package.json",
	"packages/di-craft/package.json",
	"packages/di-craft/src/**/*.ts",
	"packages/di-craft/README.md",
]
outputs = ["{{ vars.cf_pages_out_dir }}/**/*"]

[tasks."dev:docs"]
description = "Start the documentation dev server"
run = "mise run //docs:dev"

[tasks."preview:docs"]
description = "Preview the documentation production build"
run = "mise run //docs:preview"
