[task_config]
dir = "{{ config_root }}"

[vars]
repo_root = "{{ config_root }}/.."

[env]
'_'.path = [
	"{{ config_root }}/node_modules/.bin",
	"{{ vars.repo_root }}/node_modules/.bin",
]

[tasks.format]
description = "Format benchmark workspace files"
run = "biome check --write ."

[tasks."format:check"]
description = "Check benchmark workspace formatting"
run = "biome check ."

[tasks.typecheck]
description = "Type check comparative benchmarks"
depends = ["//packages/di-craft:build"]
run = "bun run typecheck"

[tasks.precondition]
description = "Validate benchmark adapter contracts"
depends = ["//packages/di-craft:build"]
run = "bun run precondition"

[tasks.test]
description = "Run benchmark workspace tests"
depends = ["//packages/di-craft:build"]
run = "bun run test"

[tasks.quick]
description = "Run one short comparative benchmark round"
depends = ["//packages/di-craft:build"]
run = "bun run bench:quick"

[tasks.public]
description = "Run a publishable comparative benchmark block"
depends = ["//packages/di-craft:build"]
run = "bun run bench:public"

[tasks.report]
description = "Render a benchmark result as Markdown"
run = "bun run bench:report --"
