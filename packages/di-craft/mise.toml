[task_config]
dir = "{{ config_root }}"

[vars]
repo_root = "{{ config_root }}/../.."

[env]
'_'.path = [
	"{{ config_root }}/node_modules/.bin",
	"{{ vars.repo_root }}/node_modules/.bin",
]

[tasks.lint]
description = "Lint di-craft package files"
run = "biome check ."

[tasks."lint:fix"]
description = "Lint and fix di-craft package files"
run = "biome check --write ."

[tasks.format]
description = "Format and fix di-craft package files"
run = "biome check --write ."

[tasks."format:check"]
description = "Check di-craft package formatting and linting"
run = "biome check ."

[tasks.typecheck]
description = "Type check di-craft source and tests"
run = "tsc --noEmit -p tsconfig/src.json && tsc --noEmit -p tsconfig/node.json && tsc --noEmit -p tsconfig/test.json"

[tasks.test]
description = "Run di-craft tests"
run = "bun test"

[tasks.build]
description = "Build di-craft with tsdown"
run = "tsdown"
sources = [
	"../../bun.lock",
	"../../bunfig.toml",
	"../../mise.toml",
	"../../package.json",
	"mise.toml",
	"package.json",
	"src/**/*.ts",
	"tsconfig/**/*.json",
	"tsconfig.json",
	"tsdown.config.ts",
]
outputs = ["dist/**/*"]

[tasks.checks]
description = "Run the full di-craft package quality pipeline"
run = [
	{ task = "format:check" },
	{ task = "typecheck" },
	{ task = "test" },
	{ task = "build" },
]
